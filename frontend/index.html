<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VishiGuard - Live Call Monitor</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white font-sans p-6">

    <header class="flex justify-between items-center border-b border-gray-700 pb-4 mb-6">
        <div>
            <h1 class="text-3xl font-bold text-blue-400">🛡️ VishiGuard</h1>
            <p class="text-gray-400 text-sm mt-1">Real-time Vishing & Deepfake Detection Engine</p>
        </div>
        <div class="flex items-center space-x-2">
            <span class="relative flex h-3 w-3">
              <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span>
              <span class="relative inline-flex rounded-full h-3 w-3 bg-green-500"></span>
            </span>
            <span class="text-green-400 text-sm font-semibold">System Active</span>
        </div>
    </header>

    <main class="grid grid-cols-1 md:grid-cols-3 gap-6">
        
        <div class="md:col-span-2 space-y-6">
            
            <div id="status-banner" class="bg-gray-800 border-l-4 border-gray-500 p-6 rounded shadow-lg transition-all duration-500">
                <h2 class="text-sm text-gray-400 uppercase tracking-wide">Current Call Status</h2>
                <p id="status-text" class="text-4xl font-black mt-2 text-gray-300">WAITING FOR CALL...</p>
            </div>

            <div class="bg-gray-800 p-6 rounded shadow-lg">
                <h3 class="text-lg font-semibold mb-4 text-gray-300">Live Danger Score</h3>
                <div class="w-full bg-gray-700 rounded-full h-8 mb-2">
                    <div id="risk-bar" class="bg-blue-500 h-8 rounded-full transition-all duration-1000" style="width: 0%"></div>
                </div>
                <div class="flex justify-between text-sm font-bold text-gray-400">
                    <span>0% (Safe)</span>
                    <span id="risk-percentage" class="text-white text-xl">0%</span>
                    <span>100% (Critical)</span>
                </div>
            </div>

            <div class="bg-gray-800 p-6 rounded shadow-lg h-48 overflow-y-auto">
                <h3 class="text-lg font-semibold mb-2 text-gray-300">Live Transcript</h3>
                <p id="transcript-box" class="text-gray-400 italic">Listening for audio stream...</p>
            </div>
        </div>

        <div class="space-y-6">
            <div class="bg-gray-800 p-6 rounded shadow-lg h-full">
                <h3 class="text-lg font-semibold border-b border-gray-700 pb-2 mb-4 text-gray-300">AI Engine Logs</h3>
                <ul class="text-sm space-y-3 text-gray-400 font-mono" id="ai-logs">
                    <li>> System initialized...</li>
                    <li>> Awaiting audio chunks...</li>
                </ul>
            </div>
        </div>
    </main>
<script>
        // UI Elements ko select karna
        const riskBar = document.getElementById('risk-bar');
        const riskPercentage = document.getElementById('risk-percentage');
        const statusBanner = document.getElementById('status-banner');
        const statusText = document.getElementById('status-text');
        const transcriptBox = document.getElementById('transcript-box');
        const aiLogs = document.getElementById('ai-logs');

        // Function: Dashboard update karna
        function updateVishiGuardUI(data) {
            // 1. Update Transcript & Logs
            transcriptBox.innerHTML += `<br><span class="text-white">Caller:</span> ${data.transcript_chunk}`;
            transcriptBox.scrollTop = transcriptBox.scrollHeight; // Auto-scroll down
            
            const newLog = document.createElement('li');
            newLog.innerText = `> ${data.log_msg}`;
            aiLogs.appendChild(newLog);

            // 2. Update Risk Meter
            riskPercentage.innerText = `${data.risk_score}%`;
            riskBar.style.width = `${data.risk_score}%`;

            // 3. Update Colors based on Threat Level
            if (data.status === "SAFE") {
                riskBar.className = "bg-green-500 h-8 rounded-full transition-all duration-1000";
                statusBanner.className = "bg-green-900 border-l-4 border-green-500 p-6 rounded shadow-lg transition-all duration-500";
                statusText.className = "text-4xl font-black mt-2 text-green-400";
                statusText.innerText = "SAFE: No Threat Detected";
            } 
            else if (data.status === "WARNING_SUSPICIOUS") {
                riskBar.className = "bg-yellow-500 h-8 rounded-full transition-all duration-1000";
                statusBanner.className = "bg-yellow-900 border-l-4 border-yellow-500 p-6 rounded shadow-lg transition-all duration-500";
                statusText.className = "text-4xl font-black mt-2 text-yellow-400";
                statusText.innerText = "WARNING: SUSPICIOUS";
            } 
            else if (data.status === "CRITICAL_CRIME") {
                riskBar.className = "bg-red-500 animate-pulse h-8 rounded-full transition-all duration-1000";
                statusBanner.className = "bg-red-900 border-l-4 border-red-500 p-6 rounded shadow-lg animate-pulse transition-all duration-500";
                statusText.className = "text-4xl font-black mt-2 text-red-400";
                statusText.innerText = "CRITICAL: SCAM DETECTED!";
            }
        }

        // --- TEST SIMULATION: Har 3 second baad naya data aayega ---
        setTimeout(() => {
            updateVishiGuardUI({
                risk_score: 15, 
                status: "SAFE", 
                transcript_chunk: "Hello? Is this Haleema?", 
                log_msg: "Acoustic profile matches normal human voice."
            });
        }, 2000);

        setTimeout(() => {
            updateVishiGuardUI({
                risk_score: 45, 
                status: "WARNING_SUSPICIOUS", 
                transcript_chunk: "I am calling from your bank. There is an issue.", 
                log_msg: "NLP Alert: 'Bank' and 'Issue' detected. Intent suspicious."
            });
        }, 6000);

        setTimeout(() => {
            updateVishiGuardUI({
                risk_score: 92, 
                status: "CRITICAL_CRIME", 
                transcript_chunk: "Your account is frozen. Please share your PIN immediately to unlock it.", 
                log_msg: "CRITICAL: Urgent credential request detected. High risk of Vishing!"
            });
        }, 10000);
    </script>
</body>
</html>
